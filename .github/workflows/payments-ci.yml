name: ci-payments

# Path-filtered: payments only rebuilds on its own or shared-kernel changes.
on:
  push:
    branches: [main]
    paths:
      - 'services/payments/**'
      - 'ServiceDefaults/**'
      - 'Contracts/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/payments/**'
      - 'ServiceDefaults/**'
      - 'Contracts/**'

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: payments
      project: Payments.csproj
    secrets: inherit
