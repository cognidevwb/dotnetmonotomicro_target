name: ci-orders

# Path-filtered: orders only rebuilds on its own or shared-kernel changes.
on:
  push:
    branches: [main]
    paths:
      - 'services/orders/**'
      - 'ServiceDefaults/**'
      - 'Contracts/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/orders/**'
      - 'ServiceDefaults/**'
      - 'Contracts/**'

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: orders
      project: Orders.csproj
    secrets: inherit
