name: ci-catalog

# Path-filtered: catalog only rebuilds on its own or shared-kernel changes.
on:
  push:
    branches: [main]
    paths:
      - 'services/catalog/**'
      - 'ServiceDefaults/**'
      - 'Contracts/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/catalog/**'
      - 'ServiceDefaults/**'
      - 'Contracts/**'

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: catalog
      project: Catalog.csproj
    secrets: inherit
