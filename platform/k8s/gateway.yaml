apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: acmeplatform
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest          # prefix with your registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: Auth__Authority
              value: ""          # https://keycloak.<host>/realms/<realm>
            - name: Auth__Audience
              value: "account"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /alive
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: acmeplatform
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
