# Dev-grade backing services for the `acmeplatform` namespace. NOT for production —
# `emptyDir` storage is ephemeral. In prod use a managed PostgreSQL / a managed broker
# / Grafana Cloud and delete this file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-db
  namespace: acmeplatform
  labels:
    app: catalog-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-db
  template:
    metadata:
      labels:
        app: catalog-db
    spec:
      containers:
        - name: db
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: "catalogdb"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: acmeplatform
spec:
  selector:
    app: catalog-db
  ports:
    - port: 5432
      targetPort: 5432
