# Deploy config for the customers service. The CI workflow wires build, test, the
# container publish, the registry (repo var ACR_LOGIN_SERVER) and the resource group —
# you do NOT set those here. The develop step fills the two fields below.
service: customers
image_repository: customers
container_app_name: customers
# Customers is an edge/HTTP service (it serves /customers and the activity probe the
# orders service calls), so it promotes staging -> production and smokes the readiness
# route that ServiceDefaults maps via app.MapDefaultEndpoints().
environments:
  - name: staging
  - name: production
    requiresApproval: true
smoke_check_path: /health
